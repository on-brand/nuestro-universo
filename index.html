<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestro Universo</title>

<style>

body{
margin:0;
overflow:hidden;
background:black;
font-family:serif;
color:white;
height:100vh;
}

h1{
position:absolute;
top:40px;
width:100%;
text-align:center;
font-size:40px;
letter-spacing:5px;
z-index:5;
color:#d8b4fe;
text-shadow:0 0 20px #9333ea;
}

.star{
position:absolute;
width:14px;
height:14px;
border-radius:50%;
background:white;
box-shadow:
0 0 10px white,
0 0 20px #c084fc,
0 0 40px #9333ea;
cursor:pointer;
animation:float 4s infinite ease-in-out;
}

@keyframes float{
0%{transform:translateY(0px);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0px);}
}

.card{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
padding:30px;
border-radius:20px;
width:80%;
max-width:300px;
text-align:center;
display:none;
z-index:10;
border:1px solid rgba(255,255,255,.2);
}

.card p{
font-size:22px;
line-height:1.5;
}

button{
margin-top:20px;
padding:10px 20px;
border:none;
border-radius:30px;
background:#9333ea;
color:white;
}

canvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
}

.tip{
position:absolute;
bottom:30px;
width:100%;
text-align:center;
opacity:.6;
font-size:15px;
letter-spacing:2px;
}

</style>
</head>

<body>

<h1>NUESTRO UNIVERSO</h1>

<div class="tip">
Toca las estrellas ✨
</div>

<audio id="music" loop>
<source src="https://files.catbox.moe/8f31m2.mp3" type="audio/mp3">
</audio>

<canvas id="bg"></canvas>

<div class="card" id="card">
<p id="text"></p>

<button onclick="closeCard()">
Cerrar
</button>
</div>

<script>

const messages = [

"Hay universos infinitos… pero terminé encontrándote a ti.",

"Tu sonrisa tiene algo que calma todo dentro de mí.",

"Eres mi casualidad favorita.",

"Coincidir contigo se sintió como destino.",

"Cada estrella guarda algo que siento por ti.",

"Tu existencia hizo más bonito mi mundo.",

"Si el tiempo se detuviera, elegiría este instante contigo.",

"Conocerte fue una de las cosas más bonitas de mi vida.",

"En otro universo también te escogería.",

"Hay algo en ti que se siente como hogar.",

"Tu voz tiene algo que me da paz.",

"El universo se siente diferente contigo.",

"Gracias por existir.",

"Contigo todo se siente más bonito.",

"Tu presencia ilumina mi universo."

];

for(let i=0;i<35;i++){

let star = document.createElement("div");

star.className = "star";

star.style.left =
Math.random()*100 + "vw";

star.style.top =
Math.random()*100 + "vh";

star.onclick = ()=>{

document.getElementById("music").play();

let random =
messages[Math.floor(Math.random()*messages.length)];

document.getElementById("text").innerText = random;

document.getElementById("card").style.display = "block";

};

document.body.appendChild(star);

}

function closeCard(){

document.getElementById("card").style.display = "none";

}

const canvas =
document.getElementById("bg");

const ctx =
canvas.getContext("2d");

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

let stars = [];

for(let i=0;i<200;i++){

stars.push({

x:Math.random()*canvas.width,

y:Math.random()*canvas.height,

r:Math.random()*2,

s:Math.random()*0.5

});

}

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.fillStyle = "white";

stars.forEach(st=>{

ctx.beginPath();

ctx.arc(st.x,st.y,st.r,0,Math.PI*2);

ctx.fill();

st.y += st.s;

if(st.y > canvas.height){

st.y = 0;

st.x = Math.random()*canvas.width;

}

});

requestAnimationFrame(animate);

}

animate();

</script>

</body>
</html>
